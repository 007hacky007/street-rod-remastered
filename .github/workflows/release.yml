name: Release

# A v* tag builds the macOS disk image and the Windows zip and attaches both to a draft release; a manual
# run builds them as artifacts only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          set -euo pipefail
          brew list ninja >/dev/null 2>&1 || brew install ninja

      - uses: actions/cache@v6
        with:
          path: build-deps/prefix
          key: macos-deps-${{ runner.os }}-${{ hashFiles('tools/macos/build-deps.sh') }}

      - name: Dependencies
        run: tools/macos/build-deps.sh

      - name: Version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's/^#define APP_VERSION_TEXT "\(.*\)"/\1/p' launcher/version.h)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: App
        run: tools/macos/package.sh --version "$VERSION"

      - name: Disk image
        run: tools/macos/make-dmg.sh --version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/Street-Rod-Enhanced.dmg
            dist/Street-Rod-Enhanced.dmg.sha256

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            sdl3:p
            wxwidgets3.2-msw:p

      - name: Zip
        run: tools/windows/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/Street-Rod-Enhanced-windows.zip
            dist/Street-Rod-Enhanced-windows.zip.sha256

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$REPO" dist/* \
            --draft --title "Street Rod Enhanced $VERSION" --generate-notes
